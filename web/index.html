<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphScript Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/css/litegraph.css">
<style>
:root {
  --bg: #1e1e2e;
  --surface: #282840;
  --border: #3a3a5c;
  --text: #cdd6f4;
  --text-dim: #6c7086;
  --accent: #89b4fa;
  --green: #a6e3a1;
  --red: #f38ba8;
  --yellow: #f9e2af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'Consolas', monospace; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* Toolbar */
#toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#toolbar button { padding: 5px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px; }
#toolbar button:hover { background: var(--border); }
#toolbar button:disabled { opacity: 0.4; cursor: default; }
#toolbar select { padding: 4px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
#toolbar .sep { width: 1px; height: 24px; background: var(--border); }
#toolbar .label { font-size: 11px; color: var(--text-dim); }

/* Main layout */
#main { display: flex; flex: 1; overflow: hidden; }

/* Left panel: Node palette */
#palette { width: 200px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
#palette h3 { padding: 8px 12px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
#palette .node-type { padding: 6px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
#palette .node-type:hover { background: var(--border); }
#palette .node-type .tags { font-size: 10px; color: var(--text-dim); }
#palette input { width: 100%; padding: 6px 12px; background: var(--bg); border: none; border-bottom: 1px solid var(--border); color: var(--text); font-size: 12px; outline: none; }

/* Center: Canvas */
#canvas-wrap { flex: 1; position: relative; }
#graph-canvas { width: 100%; height: 100%; }

/* Right panel: Properties */
#properties { width: 260px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
#properties h3 { padding: 8px 12px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
#properties .prop-section { padding: 8px 12px; border-bottom: 1px solid var(--border); }
#properties .prop-label { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
#properties .prop-value { font-size: 12px; padding: 2px 0; }

/* Bottom: Command log */
#cmd-panel { height: 180px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
#cmd-panel h3 { padding: 6px 12px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; justify-content: space-between; }
#cmd-log { flex: 1; overflow-y: auto; padding: 4px 12px; font-family: 'Consolas', monospace; font-size: 12px; }
#cmd-log .cmd-entry { padding: 2px 0; }
#cmd-log .cmd-entry .cmd-text { color: var(--accent); }
#cmd-log .cmd-entry .cmd-output { color: var(--text-dim); white-space: pre; }
#cmd-input { display: flex; border-top: 1px solid var(--border); }
#cmd-input span { padding: 6px 8px; color: var(--green); font-family: 'Consolas', monospace; font-size: 12px; }
#cmd-input input { flex: 1; padding: 6px 4px; background: var(--bg); border: none; color: var(--text); font-family: 'Consolas', monospace; font-size: 12px; outline: none; }

/* Status bar */
#status { padding: 3px 12px; background: var(--bg); border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); flex-shrink: 0; display: flex; gap: 16px; }
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="execCmd('undo')" id="btn-undo" title="Undo (Ctrl+Z)">↩ Undo</button>
  <button onclick="execCmd('redo')" id="btn-redo" title="Redo (Ctrl+Y)">↪ Redo</button>
  <div class="sep"></div>
  <span class="label">Graph:</span>
  <select id="graph-select" onchange="switchGraph(this.value)"></select>
  <button onclick="promptNewGraph()">+ New</button>
  <div class="sep"></div>
  <span class="label">Block:</span>
  <select id="block-select" onchange="switchBlock(this.value)">
    <option value="">(graph level)</option>
  </select>
  <button onclick="promptNewEvent()">+ Event</button>
  <button onclick="promptNewFn()">+ Fn</button>
  <div class="sep"></div>
  <button onclick="doValidate()">✓ Validate</button>
  <button onclick="doEmit()">📄 Emit</button>
  <button onclick="doBake()">⚡ Bake</button>
  <div class="sep"></div>
  <button onclick="doSave()">💾 Save</button>
</div>

<div id="main">
  <div id="palette">
    <input id="type-filter" placeholder="Filter nodes..." oninput="filterTypes()">
    <h3>Node Types</h3>
    <div id="type-list"></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="graph-canvas"></canvas>
  </div>
  <div id="properties">
    <h3>Properties</h3>
    <div id="prop-content"><div class="prop-section"><div class="prop-value" style="color:var(--text-dim)">Select a node to see details</div></div></div>
  </div>
</div>

<div id="cmd-panel">
  <h3>
    Command Log
    <button onclick="exportLog()" style="font-size:10px;padding:2px 8px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:3px;cursor:pointer;">Export</button>
  </h3>
  <div id="cmd-log"></div>
  <div id="cmd-input">
    <span>gs&gt;</span>
    <input id="cli-input" placeholder="Type CLI command..." onkeydown="if(event.key==='Enter')sendCli()">
  </div>
</div>

<div id="status">
  <span id="status-file">No file</span>
  <span id="status-graphs">0 graphs</span>
  <span id="status-nodes">0 nodes</span>
  <span id="status-types">0 types</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/build/litegraph.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════
let STATE = null;
let graph = new LGraph();
let canvas = null;
let currentBlock = '';
let suppressCallbacks = false;
let nodeIdToInstance = {};
let instanceToNodeId = {};
let nextAutoId = 1;

// ═══════════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════════
const API = 'http://' + window.location.host;

async function apiGet(path) {
  const r = await fetch(API + path);
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: typeof body === 'string' ? body : JSON.stringify(body)
  });
  return r.json();
}

async function execCmd(cmd) {
  const result = await apiPost('/api/exec', { command: cmd });
  if (result.state) updateState(result.state);
  logEntry(cmd, result.output || '');
  return result;
}

async function sendCli() {
  const input = document.getElementById('cli-input');
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';
  await execCmd(cmd);
}

// ═══════════════════════════════════════════════════════════════════
// State management
// ═══════════════════════════════════════════════════════════════════
function updateState(s) {
  STATE = s;
  updateToolbar();
  updateGraphSelect();
  updateBlockSelect();
  updatePalette();
  updateStatusBar();
  rebuildCanvas();
}

function activeGraph() {
  if (!STATE || STATE.active_graph < 0) return null;
  return STATE.module.graphs[STATE.active_graph] || null;
}

function updateToolbar() {
  document.getElementById('btn-undo').disabled = !STATE?.can_undo;
  document.getElementById('btn-redo').disabled = !STATE?.can_redo;
}

function updateGraphSelect() {
  const sel = document.getElementById('graph-select');
  sel.innerHTML = '';
  if (!STATE) return;
  STATE.module.graphs.forEach((g, i) => {
    const opt = document.createElement('option');
    opt.value = g.name;
    opt.textContent = g.name + (g.base_type ? ' : ' + g.base_type : '');
    opt.selected = (i === STATE.active_graph);
    sel.appendChild(opt);
  });
}

function updateBlockSelect() {
  const sel = document.getElementById('block-select');
  sel.innerHTML = '<option value="">(graph level)</option>';
  const g = activeGraph();
  if (!g) return;
  g.events.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.name;
    opt.textContent = 'event ' + e.name;
    opt.selected = (e.name === currentBlock);
    sel.appendChild(opt);
  });
  g.functions.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.name;
    opt.textContent = 'fn ' + f.name;
    opt.selected = (f.name === currentBlock);
    sel.appendChild(opt);
  });
}

function updatePalette() {
  const list = document.getElementById('type-list');
  list.innerHTML = '';
  if (!STATE) return;
  const filter = document.getElementById('type-filter').value.toLowerCase();
  STATE.types.forEach(t => {
    if (filter && !t.type_name.toLowerCase().includes(filter)) return;
    const div = document.createElement('div');
    div.className = 'node-type';
    div.textContent = t.type_name;
    if (t.tags.length) {
      const tags = document.createElement('div');
      tags.className = 'tags';
      tags.textContent = t.tags.join(', ');
      div.appendChild(tags);
    }
    div.ondblclick = () => promptAddNode(t.type_name);
    list.appendChild(div);
  });
}

function filterTypes() { updatePalette(); }

function updateStatusBar() {
  if (!STATE) return;
  const g = activeGraph();
  document.getElementById('status-file').textContent = STATE.file_path || 'No file';
  document.getElementById('status-graphs').textContent = STATE.module.graphs.length + ' graphs';
  document.getElementById('status-nodes').textContent = (g ? g.nodes.length : 0) + ' nodes';
  document.getElementById('status-types').textContent = STATE.types.length + ' types';
}

// ═══════════════════════════════════════════════════════════════════
// LiteGraph canvas rebuild
// ═══════════════════════════════════════════════════════════════════
function rebuildCanvas() {
  suppressCallbacks = true;
  graph.clear();
  nodeIdToInstance = {};
  instanceToNodeId = {};

  const g = activeGraph();
  if (!g) { suppressCallbacks = false; canvas?.setDirty(true, true); return; }

  // Register node types from STATE.types
  registerNodeTypes();

  // Add parameter context node (virtual entry point)
  const ctxNode = LiteGraph.createNode('gs/context');
  if (ctxNode) {
    ctxNode.pos = [50, 200];
    graph.add(ctxNode);
    nodeIdToInstance[ctxNode.id] = 'context';
    instanceToNodeId['context'] = ctxNode.id;

    // Add graph parameter pins to context
    g.parameters.forEach(p => {
      if (p.direction === 'in' || p.direction === 'var') {
        ctxNode.addOutput(p.name, p.type || 'any');
      }
      if (p.direction === 'out' || p.direction === 'var') {
        ctxNode.addInput(p.name, p.type || 'any');
      }
    });
  }

  // Add node instances
  let yOffset = 50;
  g.nodes.forEach((ni, i) => {
    const typePath = 'gs/' + ni.type;
    let node = LiteGraph.createNode(typePath);
    if (!node) {
      node = LiteGraph.createNode('gs/_unknown');
      if (node) node.title = ni.type + ' (?)';
    }
    if (node) {
      node.pos = [350 + (i % 3) * 250, yOffset + Math.floor(i / 3) * 150];
      node.title = ni.instance;
      graph.add(node);
      nodeIdToInstance[node.id] = ni.instance;
      instanceToNodeId[ni.instance] = node.id;
    }
  });

  // Add connections for the current block
  if (currentBlock) {
    const block = [...g.events, ...g.functions].find(b => b.name === currentBlock);
    if (block) {
      addBlockConnections(block);
    }
  } else {
    // Show all connections from all blocks
    g.events.forEach(b => addBlockConnections(b));
    g.functions.forEach(b => addBlockConnections(b));
  }

  suppressCallbacks = false;
  canvas?.setDirty(true, true);
}

function addBlockConnections(block) {
  block.flows.forEach(fc => {
    const fromId = instanceToNodeId[fc.from_node];
    const toId = instanceToNodeId[fc.to_node];
    if (fromId == null || toId == null) return;
    const fromNode = graph.getNodeById(fromId);
    const toNode = graph.getNodeById(toId);
    if (!fromNode || !toNode) return;
    const outSlot = fromNode.findOutputSlot(fc.from_pin);
    const inSlot = toNode.findInputSlot(fc.to_pin);
    if (outSlot >= 0 && inSlot >= 0) fromNode.connect(outSlot, toNode, inSlot);
  });

  block.links.forEach(dl => {
    const srcId = instanceToNodeId[dl.source_node];
    const tgtId = instanceToNodeId[dl.target_node];
    if (srcId == null || tgtId == null) return;
    const srcNode = graph.getNodeById(srcId);
    const tgtNode = graph.getNodeById(tgtId);
    if (!srcNode || !tgtNode) return;
    const outSlot = srcNode.findOutputSlot(dl.source_pin || dl.source_node);
    const inSlot = tgtNode.findInputSlot(dl.target_pin);
    if (outSlot >= 0 && inSlot >= 0) srcNode.connect(outSlot, tgtNode, inSlot);
  });
}

function registerNodeTypes() {
  if (!STATE) return;

  // Context node (virtual entry)
  if (!LiteGraph.registered_node_types['gs/context']) {
    function ContextNode() {
      this.addOutput('start', 'exec');
    }
    ContextNode.title = 'Context';
    ContextNode.prototype.color = '#2a4a3a';
    LiteGraph.registerNodeType('gs/context', ContextNode);
  }

  // Unknown fallback
  if (!LiteGraph.registered_node_types['gs/_unknown']) {
    function UnknownNode() {}
    UnknownNode.title = '???';
    UnknownNode.prototype.color = '#4a2a2a';
    LiteGraph.registerNodeType('gs/_unknown', UnknownNode);
  }

  STATE.types.forEach(t => {
    const path = 'gs/' + t.type_name;
    if (LiteGraph.registered_node_types[path]) return;

    const pins = t.pins;
    function GSNode() {
      pins.forEach(p => {
        const slotType = p.kind === 'exec' ? 'exec' : (p.type || 'any');
        if (p.direction === 'in') this.addInput(p.name, slotType);
        else this.addOutput(p.name, slotType);
      });
    }
    GSNode.title = t.type_name;
    GSNode.prototype.color = t.is_native ? '#2a3a5a' : '#3a2a5a';
    LiteGraph.registerNodeType(path, GSNode);
  });
}

// ═══════════════════════════════════════════════════════════════════
// GUI → CLI command mapping
// ═══════════════════════════════════════════════════════════════════

// Called when user double-clicks a node type in the palette
async function promptAddNode(typeName) {
  const name = prompt('Instance name for ' + typeName + ':', typeName.toLowerCase() + (nextAutoId++));
  if (!name) return;
  await execCmd('add ' + typeName + ' ' + name);
}

async function promptNewGraph() {
  const name = prompt('New graph name:');
  if (!name) return;
  const base = prompt('Base type (leave empty for none):', '');
  const cmd = base ? 'new ' + name + ' : ' + base : 'new ' + name;
  await execCmd(cmd);
}

async function promptNewEvent() {
  const name = prompt('Event name:');
  if (!name) return;
  await execCmd('event ' + name);
  currentBlock = name;
  updateBlockSelect();
}

async function promptNewFn() {
  const name = prompt('Function name:');
  if (!name) return;
  await execCmd('fn ' + name);
  currentBlock = name;
  updateBlockSelect();
}

function switchGraph(name) { execCmd('open ' + name); }
function switchBlock(name) { currentBlock = name; rebuildCanvas(); }

async function doValidate() { await execCmd('validate'); }
async function doEmit() {
  const result = await execCmd('emit');
  // Show in a modal or alert
  const text = result.output || '';
  if (text.trim()) {
    const w = window.open('', '_blank', 'width=600,height=500');
    w.document.write('<pre style="font-family:Consolas;font-size:13px;padding:20px;background:#1e1e2e;color:#cdd6f4">' +
      text.replace(/</g, '&lt;') + '</pre>');
  }
}
async function doBake() { await execCmd('bake'); }
async function doSave() {
  const path = prompt('Save to file:', STATE?.file_path || 'output.gs');
  if (!path) return;
  await execCmd('save ' + path);
}

// ═══════════════════════════════════════════════════════════════════
// Command log
// ═══════════════════════════════════════════════════════════════════
function logEntry(cmd, output) {
  const log = document.getElementById('cmd-log');
  const div = document.createElement('div');
  div.className = 'cmd-entry';
  div.innerHTML = '<span class="cmd-text">&gt; ' + escHtml(cmd) + '</span>';
  if (output && output.trim()) {
    div.innerHTML += '<div class="cmd-output">' + escHtml(output.trim()) + '</div>';
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportLog() {
  if (!STATE) return;
  const text = STATE.command_log.join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'commands.gscmd';
  a.click();
}

// ═══════════════════════════════════════════════════════════════════
// Properties panel
// ═══════════════════════════════════════════════════════════════════
function showNodeProperties(lgNode) {
  const panel = document.getElementById('prop-content');
  if (!lgNode || !STATE) {
    panel.innerHTML = '<div class="prop-section"><div class="prop-value" style="color:var(--text-dim)">Select a node to see details</div></div>';
    return;
  }

  const instName = nodeIdToInstance[lgNode.id];
  const g = activeGraph();
  if (!g || !instName) return;

  let html = '<div class="prop-section">';
  html += '<div class="prop-label">Instance</div><div class="prop-value">' + escHtml(instName) + '</div>';
  html += '<div class="prop-label">Title</div><div class="prop-value">' + escHtml(lgNode.title || '') + '</div>';
  html += '</div>';

  // Find node definition
  const ni = g.nodes.find(n => n.instance === instName);
  if (ni) {
    const def = STATE.types.find(t => t.type_name === ni.type);
    html += '<div class="prop-section"><div class="prop-label">Type</div><div class="prop-value">' + escHtml(ni.type) + '</div></div>';
    if (def) {
      html += '<div class="prop-section"><div class="prop-label">Pins</div>';
      def.pins.forEach(p => {
        const icon = p.kind === 'exec' ? '▶' : '●';
        const dir = p.direction === 'in' ? '←' : '→';
        html += '<div class="prop-value">' + icon + ' ' + dir + ' ' + escHtml(p.name);
        if (p.type) html += ' : ' + escHtml(p.type);
        html += '</div>';
      });
      html += '</div>';
    }
  }

  // Show connections involving this node
  const connections = [];
  [...(g.events || []), ...(g.functions || [])].forEach(block => {
    block.flows.forEach(f => {
      if (f.from_node === instName || f.to_node === instName) {
        connections.push('[' + block.name + '] flow ' + f.from_node + '.' + f.from_pin + ' → ' + f.to_node + '.' + f.to_pin);
      }
    });
    block.links.forEach(l => {
      if (l.target_node === instName || l.source_node === instName) {
        connections.push('[' + block.name + '] link ' + l.target_node + '.' + l.target_pin + ' = ' + l.source_node + (l.source_pin ? '.' + l.source_pin : ''));
      }
    });
  });

  if (connections.length) {
    html += '<div class="prop-section"><div class="prop-label">Connections</div>';
    connections.forEach(c => { html += '<div class="prop-value" style="font-size:11px">' + escHtml(c) + '</div>'; });
    html += '</div>';
  }

  panel.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════
// Keyboard shortcuts
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); execCmd('undo'); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); execCmd('redo'); }
  if (e.key === 'Delete') {
    const sel = canvas?.selected_nodes;
    if (sel) {
      for (const id in sel) {
        const inst = nodeIdToInstance[id];
        if (inst && inst !== 'context') execCmd('rm ' + inst);
      }
    }
  }
});

// ═══════════════════════════════════════════════════════════════════
// Canvas callbacks → CLI commands
// ═══════════════════════════════════════════════════════════════════
function setupCanvasCallbacks() {
  graph.onNodeSelected = function(node) {
    showNodeProperties(node);
  };

  // Track connection creation
  graph.onAfterChange = function() {
    if (suppressCallbacks) return;
    // For now, connections are managed via CLI commands
    // Canvas-level changes are visual only
  };
}

// ═══════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════
async function init() {
  // Setup LiteGraph
  LiteGraph.node_box_coloured_when_on = true;
  const canvasEl = document.getElementById('graph-canvas');
  canvas = new LGraphCanvas(canvasEl, graph);
  canvas.background_image = null;
  canvas.clear_background_color = '#181825';
  canvas.render_shadows = false;
  canvas.render_connections_border = false;
  canvas.default_link_color = '#89b4fa';

  setupCanvasCallbacks();

  // Load initial state
  try {
    STATE = await apiGet('/api/state');
    updateState(STATE);
  } catch(e) {
    logEntry('(init)', 'Failed to connect to server: ' + e.message);
  }

  // Resize canvas on window resize
  function resize() {
    const wrap = document.getElementById('canvas-wrap');
    canvasEl.width = wrap.clientWidth;
    canvasEl.height = wrap.clientHeight;
    canvas.setDirty(true, true);
  }
  window.addEventListener('resize', resize);
  resize();
}

init();
</script>
</body>
</html>
